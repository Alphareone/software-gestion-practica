version: '3.8'

services:
  web:
    build: .
    container_name: gestion_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/SOFWARE-DE-GESTI-N
    depends_on:
      - db
    environment:
      - APP_ENV=development

  db:
    image: mysql:8.0
    container_name: gestion_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: gestion_db
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: gestion_pass
      MYSQL_ROOT_PASSWORD: gestion_root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./Docs/database/SCHEMA.sql:/docker-entrypoint-initdb.d/init.sql


volumes:
  db_data:
